name = "agenda-voz"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# A chave da Anthropic NÃO fica aqui. Ela é guardada com:
#   npx wrangler secret put ANTHROPIC_API_KEY

# Convites: quantos amigos entraram com cada código
[[kv_namespaces]]
binding = "CONVITES"
id = "4cba6bc7796a477693f71bb856d5a34c"

# Limite diário de uso da IA por aparelho e por IP
[[durable_objects.bindings]]
name = "USO"
class_name = "ContadorUso"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ContadorUso"]

# Avisos pelo WhatsApp: números ligados e próximos avisos de cada pessoa
[[durable_objects.bindings]]
name = "AVISOS"
class_name = "AvisosWhatsapp"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["AvisosWhatsapp"]
